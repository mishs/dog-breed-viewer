[build]
  # Build from the repository root even if a site sets a base directory in the UI
  base = "/"
  command = "npm ci --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"

# Serve the single-page app for any unknown path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
